  exHist: el => sheetHist(S.draft.ex[+el.dataset.x].name),
  exMove: el => { const i = +el.dataset.x, j = i + +el.dataset.d, ex = S.draft.ex; if (j < 0 || j >= ex.length || ex[j].blk !== ex[i].blk) { toast('Ya está en el extremo del bloque'); return; } [ex[i], ex[j]] = [ex[j], ex[i]]; S.draft.step = (S.draft.step || 0) + (j - i); save(); closeSheet(); rerender(); },
  exRemove: el => { const x = S.draft.ex[+el.dataset.x]; if (x.sets.some(z => z.done) && !confirm('Este ejercicio tiene series marcadas. ¿Quitarlo?')) return; S.draft.ex.splice(+el.dataset.x, 1); save(); closeSheet(); rerender(); },
  addEx: () => sheetAddEx(),
  addExConfirm: () => {
    const name = $('#newExName').value.trim(); if (!name) { toast('Escribe un nombre'); return; }
    const metric = $('#newExMetric').value, blk = $('#newExBlk').value, n = Math.max(1, Math.min(10, parseInt($('#newExSets').value) || 3)), r = Math.max(1, parseInt($('#newExReps').value) || 10);
    const x = { key: uid(), name, metric, basic: false, side: false, blk, alts: [], t: { sets: [n, n], reps: [r, r], inc: metric === 'wr' ? 2.5 : 0, rest: 0 }, sets: Array.from({ length: n }, () => ({ w: '', r: '', rir: '', done: false })), note: '' };
    const lastIdx = S.draft.ex.map(e => e.blk).lastIndexOf(blk);
    S.draft.ex.splice(lastIdx >= 0 ? lastIdx + 1 : S.draft.ex.length, 0, x);
    save(); closeSheet(); rerender(); toast('Ejercicio añadido');
  },
  finish: () => sheetFinish(),
  rate: el => { S.draft.rating = +el.dataset.n; save(); document.querySelectorAll('#stars button').forEach(b => b.classList.toggle('on', +b.dataset.n === S.draft.rating)); },
  saveSession: () => saveSession(),
  discard: () => { if (!confirm('¿Descartar la sesión? No se guardará nada.')) return; S.draft = null; setRest(null); save(); wake(false); go('home'); toast('Sesión descartada'); },
  restAdj: el => { if (!rest) return; rest.end = Math.max(Date.now() + 1000, rest.end + +el.dataset.n * 1000); rest.total = Math.max(rest.total, (rest.end - Date.now()) / 1000); rest.fired = false; setRest(rest); tick(); },
  restClose: () => { setRest(null); tick(); },
  closeSheet: () => closeSheet(),
  openSession: el => sheetSession(el.dataset.id),
  delSession: el => { if (!confirm('¿Eliminar esta sesión del historial? No se puede deshacer.')) return; S.sessions = S.sessions.filter(s => s.id !== el.dataset.id); save(); closeSheet(); rerender(); toast('Sesión eliminada'); },
  calNav: el => { const n = +el.dataset.n, m = ui.calMonth; ui.calMonth = n === 0 ? null : new Date(m.getFullYear(), m.getMonth() + n, 1); if (n === 0) ui.calSel = ymd(new Date()); render(); },
  calDay: el => { ui.calSel = el.dataset.d; rerender(); },
  goal: el => { S.settings.goal = +el.dataset.n; save(); rerender(); },
  progTab: el => { ui.progTab = el.dataset.t; render(); },
  exOpen: el => { closeSheet(); go('exDetail', { exName: el.dataset.name, chart: 'e1rm' }); },
  chart: el => { ui.chart = el.dataset.c; rerender(); },
  bodySave: () => {
    const date = $('#bDate').value || ymd(new Date()), e = { date, kg: $('#bKg').value.replace(',', '.'), waist: $('#bWaist').value.replace(',', '.'), arm: $('#bArm').value.replace(',', '.'), thigh: $('#bThigh').value.replace(',', '.') };
    if (!num(e.kg) && !num(e.waist) && !num(e.arm) && !num(e.thigh)) { toast('Introduce al menos un dato'); return; }
    const old = S.body.find(b => b.date === date);
    if (old) { for (const k of ['kg', 'waist', 'arm', 'thigh']) if (has(e[k])) old[k] = e[k]; } else S.body.push(e);
    save(); rerender(); toast('Registro guardado');
  },
  bodyDel: el => { if (!confirm('¿Eliminar este registro?')) return; S.body = S.body.filter(b => b.date !== el.dataset.d); save(); rerender(); },
  toggle: el => { const k = el.dataset.k; S.settings[k] = !S.settings[k]; save(); el.querySelector('.sw').classList.toggle('on', S.settings[k]); if (k === 'wake') wake(S.settings.wake); },
  editDay: el => go('editDay', { editDay: el.dataset.day }),
  dayMove: el => { const o = S.routine.order, i = o.indexOf(el.dataset.day), j = i + +el.dataset.d; if (i < 0 || j < 0 || j >= o.length) return; [o[i], o[j]] = [o[j], o[i]]; save(); rerender(); },
  addDay: () => sheetAddDay(),
  addDayConfirm: el => addDay(el.dataset.from),
  delDay: el => delDay(el.dataset.day),
  finishFromMenu: () => sheetFinish(),
  editEx: el => sheetEditEx(el.dataset.b, +el.dataset.i),
  fToggle: el => $('#' + el.dataset.f).classList.toggle('on'),
  saveEx: el => {
    const d = S.routine.days[ui.editDay], b = el.dataset.b, i = +el.dataset.i;
    const name = $('#fName').value.trim(); if (!name) { toast('Escribe un nombre'); return; }
    const int = (id, def) => Math.max(1, parseInt($(id).value) || def);
    let s0 = int('#fS0', 3), s1 = int('#fS1', s0), r0 = int('#fR0', 8), r1 = int('#fR1', r0);
    if (s1 < s0) [s0, s1] = [s1, s0]; if (r1 < r0) [r0, r1] = [r1, r0];
    const base = i >= 0 ? d[b][i] : { id: uid() };
    const e = { ...base, name, metric: $('#fMetric').value, sets: [s0, s1], reps: [r0, r1], inc: Math.max(0, num($('#fInc').value)), rest: Math.max(0, parseInt($('#fRest').value) || 0), alts: $('#fAlts').value.split(',').map(a => a.trim()).filter(Boolean), basic: $('#fBasic').classList.contains('on'), side: $('#fSide').classList.contains('on') };
    if (i >= 0) d[b][i] = e; else d[b].push(e);
    save(); closeSheet(); rerender(); toast('Rutina actualizada');
  },
  moveEx: el => { const l = S.routine.days[ui.editDay][el.dataset.b], i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; save(); closeSheet(); rerender(); },
  delEx: el => { if (!confirm('¿Eliminar este ejercicio de la rutina?')) return; S.routine.days[ui.editDay][el.dataset.b].splice(+el.dataset.i, 1); save(); closeSheet(); rerender(); },
  resetRoutine: () => { if (!confirm('¿Restaurar la rutina PHUL original? Se pierden tus cambios en ejercicios (no el historial).')) return; S.routine = clone(DEFAULT_ROUTINE); save(); toast('Rutina restaurada'); render(); },
  timerStart: () => startTimer(),
  timerOpen: () => { go('timer'); wake(true); },
  timerPause: () => { const T = S.timer; if (!T) return; if (T.pausedAt) { T.pausedTotal += Date.now() - T.pausedAt; T.pausedAt = 0; wake(true); } else T.pausedAt = Date.now(); save(); rerender(); },
  timerSkip: () => { const T = S.timer; if (!T) return; const st = timerState(); if (st.done) return; T.skip = T.skip || {}; T.skip[st.i] = (T.skip[st.i] || 0) + st.left; T.start -= st.left * 1000; save(); tick(); },
  timerFinish: () => { closeSheet(); const st = timerState(); if (!st.done && !confirm('¿Terminar el 4×4 ahora? Se guardará lo completado.')) return; finishTimer(); },
  timerDiscard: () => { closeSheet(); if (!confirm('¿Descartar el 4×4? No se guardará nada.')) return; S.timer = null; save(); wake(false); go('home'); },
  cardioLog: el => sheetCardio({ date: el.dataset.d }),
  cardioKind: el => {
    const k = el.dataset.k, c = CARDIO[k]; $('#cKind').dataset.k = k;
    document.querySelectorAll('#cKind button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
    $('#cM').value = c.m; $('#cV').value = c.v; $('#cHint').textContent = c.name + (c.hint ? ' · ' + c.hint : '');
  },
  cardioSave: () => {
    const kind = $('#cKind').dataset.k, m = Math.max(0, num($('#cM').value)), v = Math.max(0, num($('#cV').value));
    if (!(m + v > 0)) { toast('Introduce los minutos'); return; }
    S.cardio.push({ id: uid(), kind, date: $('#cDate').value || ymd(new Date()), m, v, note: $('#cNote').value.trim() });
    save(); closeSheet(); rerender(); toast(`Cardio guardado · ${fmt(m + 2 * v)} min equivalentes`);
  },
  cardioOpen: el => sheetCardioEntry(el.dataset.id),
  cardioDel: el => { if (!confirm('¿Eliminar este registro de cardio?')) return; S.cardio = S.cardio.filter(c => c.id !== el.dataset.id); save(); closeSheet(); rerender(); },
  export: () => exportData(),
  import: () => $('#importFile').click(),
  wipe: () => { if (!confirm('¿Borrar TODOS los datos? Exporta antes una copia si la quieres conservar.')) return; if (!confirm('Última confirmación: se eliminará todo el historial.')) return; S = freshState(); rest = null; WL && wake(false); save(); go('home'); toast('Datos borrados'); },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; unlockAudio(); const f = A[el.dataset.act]; if (f) f(el, e); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f && el.dataset.x != null && S.draft) { const z = S.draft.ex[+el.dataset.x]?.sets[+el.dataset.s]; if (z) { z[el.dataset.f] = el.value.replace(',', '.'); saveSoon(); } }
  else if (el.dataset.xnote != null && S.draft) { S.draft.ex[+el.dataset.xnote].note = el.value; saveSoon(); }
  else if (el.hasAttribute('data-snote') && S.draft) { S.draft.note = el.value; saveSoon(); }
  else if (el.dataset.setf) { S.settings[el.dataset.setf] = el.value.replace(/[^0-9]/g, ''); saveSoon(); }
  else if (el.dataset.dayf && ui.editDay) { const v = el.value.trim(); if (v) { S.routine.days[ui.editDay][el.dataset.dayf] = el.dataset.dayf === 'short' ? v.toUpperCase() : v; saveSoon(); } }
});
// Enter en un campo de serie salta al siguiente campo
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input.num')) return;
  e.preventDefault(); const all = [...document.querySelectorAll('input.num')]; const n = all[all.indexOf(e.target) + 1]; if (n) n.focus(); else e.target.blur();
});
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.sessions) || !data.routine) throw new Error('formato');
    if (!confirm(`La copia tiene ${data.sessions.length} sesiones. ¿Reemplazar los datos actuales?`)) return;
    localStorage.setItem(KEY, JSON.stringify(data)); S = load(); save(); go('home'); toast('Copia importada');
  } catch (err) { toast('Archivo no válido'); }
});
function exportData() {
  const name = `phul-respaldo-${ymd(new Date())}.json`, json = JSON.stringify(S, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(() => {}); return; }
  } catch (e) { }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Copia descargada');
}

/* Comprobación de instalación: ¿el servidor tiene manifest.json e iconos? */
let installState = location.protocol.startsWith('http') ? 'checking' : 'file';
function installMsg() {
  return {
    checking: 'Comprobando archivos de instalación…',
    ok: '✓ Instalable: el servidor tiene el manifiesto y los iconos.',
    missing: '⚠ Faltan archivos en el servidor (manifest.json o iconos). Sube la carpeta completa, no solo index.html; sin ellos el teléfono no puede instalar la app.',
    file: 'Abierta como archivo local: funciona, pero para instalarla hay que abrirla desde una dirección https.',
  }[installState];
}
if (installState === 'checking') Promise.all(['manifest.json', 'icono-192.png', 'icono-512.png', 'icono-maskable.png'].map(f => fetch(f, { cache: 'no-store' }).then(r => r.ok).catch(() => false)))
  .then(r => { installState = r.every(Boolean) ? 'ok' : 'missing'; const el = $('#installState'); if (el) el.textContent = installMsg(); });

/* Arranque */
render();
if (S.draft || S.timer) wake(true);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
